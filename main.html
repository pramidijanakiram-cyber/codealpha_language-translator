<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>
<style>
  :root{
    --ink:#1c2431;
    --paper:#f6f3ec;
    --paper-dim:#eae5d8;
    --rule:#d8d1bf;
    --accent:#2b4570;
    --accent-soft:#3d5a80cc;
    --stamp:#b5533c;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(43,69,112,0.05), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .sheet{
    width:100%;
    max-width:760px;
    background:var(--paper);
    border:1px solid var(--rule);
    position:relative;
    box-shadow: 6px 6px 0 rgba(28,36,49,0.06);
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--rule);
    pointer-events:none;
  }
  header{
    padding:34px 40px 20px;
    border-bottom:1px solid var(--rule);
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    margin:0;
    font-family:var(--serif);
    font-weight:700;
    font-size:32px;
    letter-spacing:0.5px;
    color:var(--ink);
  }
  .postmark{
    font-family:var(--mono);
    font-size:12px;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:4px 10px;
    border-radius:999px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .sub{
    margin:6px 0 0;
    font-size:14.5px;
    color:#4b5568;
    max-width:52ch;
    line-height:1.5;
  }

  main{ padding:28px 40px 36px; }

  .lang-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .lang-field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .lang-field label{
    font-family:var(--mono);
    font-size:11px;
    color:#6b7382;
    letter-spacing:0.06em;
  }
  select{
    font-family:var(--serif);
    font-size:16px;
    padding:9px 10px;
    background:var(--paper);
    border:none;
    border-bottom:2px solid var(--ink);
    color:var(--ink);
    appearance:none;
    cursor:pointer;
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:2px; }

  .swap-btn{
    width:38px; height:38px;
    align-self:flex-end;
    margin-bottom:9px;
    border:1px solid var(--ink);
    background:var(--paper);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transition:transform 0.25s ease, background 0.2s ease;
    flex-shrink:0;
  }
  .swap-btn:hover{ background:var(--accent); color:var(--paper); }
  .swap-btn.spin{ transform:rotate(180deg); }

  .panes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    border:1px solid var(--rule);
  }
  @media (max-width:600px){
    .panes{ grid-template-columns:1fr; }
    .panes .pane:first-child{ border-bottom:1px solid var(--rule); }
  }
  .pane{
    display:flex;
    flex-direction:column;
    min-height:180px;
    position:relative;
  }
  .pane:first-child{ border-right:1px solid var(--rule); }
  @media (max-width:600px){ .pane:first-child{ border-right:none; } }

  .pane-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 14px;
    background:var(--paper-dim);
    font-family:var(--mono);
    font-size:11px;
    color:#6b7382;
    letter-spacing:0.05em;
  }
  textarea{
    flex:1;
    resize:none;
    border:none;
    background:transparent;
    font-family:var(--serif);
    font-size:17px;
    line-height:1.55;
    padding:16px;
    color:var(--ink);
  }
  textarea:focus{ outline:none; }
  textarea::placeholder{ color:#9aa1ad; font-style:italic; }

  .output-text{
    flex:1;
    padding:16px;
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    color:var(--ink);
    overflow-y:auto;
  }
  .output-text.placeholder{ color:#9aa1ad; font-style:italic; }

  .pane-lang{
    color:var(--accent);
    font-weight:600;
    text-transform:none;
    letter-spacing:0;
  }

  .pane-tools{ display:flex; gap:6px; }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:14px;
    color:#6b7382;
    padding:2px 6px;
    border-radius:4px;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--rule); }
  .icon-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .icon-btn:disabled:hover{ background:none; color:#6b7382; }

  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    gap:14px;
  }
  .count{ font-family:var(--mono); font-size:11px; color:#8a91a0; }
  .translate-btn{
    font-family:var(--serif);
    font-size:16px;
    font-weight:700;
    padding:11px 28px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
    letter-spacing:0.3px;
    transition:background 0.2s ease;
  }
  .translate-btn:hover{ background:var(--accent); }
  .translate-btn:disabled{ background:#9aa1ad; cursor:not-allowed; }

  .status{
    min-height:18px;
    margin-top:10px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--stamp);
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:9px 18px;
    font-family:var(--mono);
    font-size:12.5px;
    border-radius:4px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="brand">
      <h1>Translator</h1>
      <span class="postmark">translated · par avion</span>
    </div>
    <p class="sub">Write in one language, read it in another. Pick where the words start and where they should land.</p>
  </header>

  <main>
    <div class="lang-row">
      <div class="lang-field">
        <label for="sourceLang">FROM</label>
        <select id="sourceLang"></select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">⇄</button>
      <div class="lang-field">
        <label for="targetLang">TO</label>
        <select id="targetLang"></select>
      </div>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <span>ORIGINAL <span class="pane-lang" id="sourcePaneLang">— Detect language</span></span>
          <div class="pane-tools">
            <button class="icon-btn" id="speakSource" title="Listen">🔊</button>
            <button class="icon-btn" id="clearSource" title="Clear">✕</button>
          </div>
        </div>
        <textarea id="sourceText" placeholder="Type or paste text here…" maxlength="1000"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span>TRANSLATION <span class="pane-lang" id="targetPaneLang">— Spanish</span></span>
          <div class="pane-tools">
            <button class="icon-btn" id="speakTarget" title="Listen" disabled>🔊</button>
            <button class="icon-btn" id="copyBtn" title="Copy" disabled>⧉</button>
          </div>
        </div>
        <div class="output-text placeholder" id="outputText">Your translation will appear here.</div>
      </div>
    </div>

    <div class="actions">
      <span class="count" id="charCount">0 / 1000</span>
      <button class="translate-btn" id="translateBtn">Translate →</button>
    </div>
    <div class="status" id="status"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const LANGUAGES = [
    ["en","English"],["es","Spanish"],["fr","French"],["de","German"],
    ["it","Italian"],["pt","Portuguese"],["nl","Dutch"],["ru","Russian"],
    ["ja","Japanese"],["ko","Korean"],["zh","Chinese (Simplified)"],
    ["ar","Arabic"],["hi","Hindi"],["ta","Tamil"],["te","Telugu"],
    ["bn","Bengali"],["tr","Turkish"],["vi","Vietnamese"],["pl","Polish"],
    ["sv","Swedish"],["el","Greek"],["he","Hebrew"],["th","Thai"],["id","Indonesian"]
  ];

  const sourceSel = document.getElementById('sourceLang');
  const targetSel = document.getElementById('targetLang');
  const sourceText = document.getElementById('sourceText');
  const outputText = document.getElementById('outputText');
  const translateBtn = document.getElementById('translateBtn');
  const swapBtn = document.getElementById('swapBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearSource = document.getElementById('clearSource');
  const speakSource = document.getElementById('speakSource');
  const speakTarget = document.getElementById('speakTarget');
  const statusEl = document.getElementById('status');
  const charCount = document.getElementById('charCount');
  const toast = document.getElementById('toast');

  function fillSelect(sel, list, defaultCode){
    sel.innerHTML = '';
    list.forEach(([code,name])=>{
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name;
      if(code === defaultCode) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  fillSelect(sourceSel, [["auto","Detect language"], ...LANGUAGES], "auto");
  fillSelect(targetSel, LANGUAGES, "es");

  const sourcePaneLang = document.getElementById('sourcePaneLang');
  const targetPaneLang = document.getElementById('targetPaneLang');

  function updatePaneLabels(){
    sourcePaneLang.textContent = `— ${sourceSel.options[sourceSel.selectedIndex].textContent}`;
    targetPaneLang.textContent = `— ${targetSel.options[targetSel.selectedIndex].textContent}`;
  }
  sourceSel.addEventListener('change', updatePaneLabels);
  targetSel.addEventListener('change', updatePaneLabels);
  updatePaneLabels();

  let lastTranslation = "";

  sourceText.addEventListener('input', ()=>{
    charCount.textContent = `${sourceText.value.length} / 1000`;
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function setStatus(msg, isError){
    statusEl.textContent = msg || '';
    statusEl.style.color = isError ? '#b5533c' : '#8a91a0';
  }

  async function fetchMyMemory(text, from, to){
    const langpair = `${from === 'auto' ? 'autodetect' : from}|${to}`;
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('MyMemory response not ok');
    const data = await res.json();
    if(data && data.responseData && data.responseData.translatedText){
      return data.responseData.translatedText;
    }
    throw new Error('MyMemory returned no translation');
  }

  async function fetchGoogleFallback(text, from, to){
    const sl = from === 'auto' ? 'auto' : from;
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Fallback response not ok');
    const data = await res.json();
    if(Array.isArray(data) && Array.isArray(data[0])){
      return data[0].map(chunk => chunk[0]).join('');
    }
    throw new Error('Fallback returned no translation');
  }

  async function translate(){
    const text = sourceText.value.trim();
    if(!text){
      setStatus('Type something to translate first.', true);
      sourceText.focus();
      return;
    }
    const from = sourceSel.value === 'auto' ? 'auto' : sourceSel.value;
    const to = targetSel.value;

    translateBtn.disabled = true;
    translateBtn.textContent = 'Translating…';
    setStatus('');
    outputText.classList.remove('placeholder');
    outputText.textContent = '…';

    try{
      let result;
      try{
        result = await fetchMyMemory(text, from, to);
      } catch(primaryErr){
        console.warn('Primary translation service failed, trying fallback:', primaryErr);
        result = await fetchGoogleFallback(text, from, to);
      }
      lastTranslation = result;
      outputText.textContent = lastTranslation;
      copyBtn.disabled = false;
      speakTarget.disabled = false;
      setStatus(`Translated ${from === 'auto' ? '(detected)' : from} → ${to}`);
    } catch(err){
      outputText.classList.add('placeholder');
      outputText.textContent = 'Your translation will appear here.';
      if(err instanceof TypeError){
        setStatus('Could not reach the translation service. Check your internet connection or try disabling any ad-blocker/VPN for this page.', true);
      } else {
        setStatus('Could not translate right now. Please try again.', true);
      }
      console.error(err);
    } finally {
      translateBtn.disabled = false;
      translateBtn.textContent = 'Translate →';
    }
  }

  translateBtn.addEventListener('click', translate);
  sourceText.addEventListener('keydown', (e)=>{
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') translate();
  });

  swapBtn.addEventListener('click', ()=>{
    if(sourceSel.value === 'auto'){
      showToast("Pick a specific source language to swap");
      return;
    }
    swapBtn.classList.add('spin');
    setTimeout(()=> swapBtn.classList.remove('spin'), 250);

    const s = sourceSel.value, t = targetSel.value;
    // rebuild source select to include full list (minus 'auto' consideration)
    fillSelect(sourceSel, [["auto","Detect language"], ...LANGUAGES], t);
    fillSelect(targetSel, LANGUAGES, s);
    updatePaneLabels();

    if(lastTranslation){
      sourceText.value = lastTranslation;
      charCount.textContent = `${sourceText.value.length} / 1000`;
    }
    outputText.classList.add('placeholder');
    outputText.textContent = 'Your translation will appear here.';
    copyBtn.disabled = true;
    speakTarget.disabled = true;
    lastTranslation = '';
    setStatus('');
  });

  clearSource.addEventListener('click', ()=>{
    sourceText.value = '';
    charCount.textContent = '0 / 1000';
    sourceText.focus();
  });

  copyBtn.addEventListener('click', async ()=>{
    if(!lastTranslation) return;
    try{
      await navigator.clipboard.writeText(lastTranslation);
      showToast('Copied to clipboard');
    } catch(e){
      showToast('Could not copy');
    }
  });

  let voicesCache = [];
  function loadVoices(){
    voicesCache = window.speechSynthesis.getVoices();
  }
  if('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoiceFor(langCode){
    if(!voicesCache.length) loadVoices();
    // Exact match first (e.g. "es-ES" for "es"), then prefix match, then null (browser default)
    let voice = voicesCache.find(v => v.lang && v.lang.toLowerCase() === langCode.toLowerCase());
    if(!voice) voice = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith(langCode.toLowerCase()));
    return voice || null;
  }

  function speakViaRemoteAudio(text, langCode){
    // Fallback for languages with no local voice installed: fetch an
    // actual audio clip instead of relying on the OS/browser's voices.
    // Google's TTS endpoint caps length, so chunk long text conservatively.
    const chunks = [];
    let remaining = text;
    while(remaining.length > 0){
      chunks.push(remaining.slice(0, 180));
      remaining = remaining.slice(180);
    }

    let i = 0;
    const playNext = () => {
      if(i >= chunks.length) return;
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${encodeURIComponent(langCode)}&client=tw-ob&q=${encodeURIComponent(chunks[i])}`;
      const audio = new Audio(url);
      audio.onended = () => { i++; playNext(); };
      audio.onerror = () => {
        setStatus(`Couldn't play audio for "${langCode}" — no local voice and the online voice is unavailable right now.`, true);
      };
      audio.play().catch(() => {
        setStatus(`Couldn't play audio for "${langCode}" — your browser blocked autoplay or the online voice is unavailable.`, true);
      });
    };
    setStatus(`No installed voice for "${langCode}" — using an online voice instead.`);
    playNext();
  }

  function speak(text, langCode){
    if(!text) return;

    if(!('speechSynthesis' in window)){
      speakViaRemoteAudio(text, langCode);
      return;
    }

    const doSpeak = () => {
      const voice = pickVoiceFor(langCode);
      if(!voice){
        speakViaRemoteAudio(text, langCode);
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = langCode;
      utter.voice = voice;
      utter.onerror = (e) => {
        setStatus(`Couldn't play audio for "${langCode}" (${e.error || 'unknown error'}).`, true);
      };
      utter.onstart = () => setStatus('');
      window.speechSynthesis.speak(utter);
    };

    // Chrome has a known bug where speak() called immediately after cancel()
    // in the same tick silently does nothing. A short delay works around it.
    window.speechSynthesis.cancel();
    setTimeout(doSpeak, 60);
  }

  speakSource.addEventListener('click', ()=>{
    const text = sourceText.value.trim();
    if(!text){
      setStatus('Nothing to listen to yet — type something first.', true);
      return;
    }
    const lang = sourceSel.value === 'auto' ? 'en' : sourceSel.value;
    speak(text, lang);
  });
  speakTarget.addEventListener('click', ()=>{
    if(!lastTranslation){
      setStatus('Translate something first, then you can listen to it.', true);
      return;
    }
    speak(lastTranslation, targetSel.value);
  });

  // Note: listen buttons stay enabled even without speechSynthesis support,
  // since speak() falls back to an online voice via audio playback.
</script>

</body>
</html>
